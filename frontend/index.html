<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Who's The Jefe</title>
  <link rel="stylesheet" href="/frontend/css/main.css">
</head>
<body>
<script src="/frontend/node_modules/phaser/dist/phaser.min.js"></script>

<div id="office-overlay">
  <div id="hud">
    <div id="hud-day">Day 1</div>
    <div id="hud-agency">Your Agency</div>
  </div>
  <div class="zone-label" style="left: 548px; top: 125px;">Meeting Room</div>
  <div class="zone-label" style="left: 608px; top: 373px;">Break Area</div>
  <div class="zone-label" style="left: 30px; top: 390px;">Remote</div>
</div>

<button id="inbox-btn">📬 Inbox <span id="unread-count">0</span></button>

<div id="inbox-panel">
  <div id="inbox-header">
    <h2>📬 Inbox</h2>
    <button id="close-inbox">✕</button>
  </div>
  <div id="email-list"></div>
</div>

<div id="email-detail">
  <div id="detail-header">
    <span id="detail-sender"></span>
    <button id="close-detail">✕</button>
  </div>
  <div id="detail-content">
    <div id="detail-subject"></div>
    <div id="detail-day"></div>
    <div id="detail-body"></div>
  </div>
  <div id="reply-area">
    <textarea id="reply-text" placeholder="Write your reply..."></textarea>
    <button id="send-reply">Send Reply</button>
    <div id="reply-status">✓ Reply sent — your employee will react shortly.</div>
  </div>
</div>

<script type="module">
  import { initInbox } from '/frontend/js/inbox.js';
  import { initLabels } from '/frontend/js/labels.js';
  import '/frontend/js/game.js';

  initInbox();
  initLabels();
</script>
</body>
</html>
