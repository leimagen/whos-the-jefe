<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Who's The Jefe</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: monospace; }
    canvas { image-rendering: pixelated; image-rendering: crisp-edges; }

    #inbox-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #3b3b5c;
      color: #fff;
      border: 1px solid #6b6b9b;
      padding: 8px 16px;
      cursor: pointer;
      font-family: monospace;
      font-size: 13px;
      z-index: 100;
    }
    #inbox-btn.has-unread {
      background: #7c3aed;
      border-color: #a78bfa;
    }
    #unread-count {
      display: inline-block;
      background: #ef4444;
      color: white;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      font-size: 11px;
      text-align: center;
      line-height: 18px;
      margin-left: 6px;
      display: none;
    }

    #inbox-panel {
      display: none;
      position: fixed;
      top: 0; right: 0;
      width: 420px;
      height: 100vh;
      background: #12122a;
      border-left: 1px solid #3b3b5c;
      z-index: 200;
      flex-direction: column;
    }
    #inbox-panel.open { display: flex; }

    #inbox-header {
      padding: 16px;
      border-bottom: 1px solid #3b3b5c;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #inbox-header h2 { color: #fff; font-size: 14px; }
    #close-inbox { background: none; border: none; color: #888; cursor: pointer; font-size: 18px; }

    #email-list {
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .email-item {
      padding: 12px 16px;
      border-bottom: 1px solid #1e1e3a;
      cursor: pointer;
      transition: background 0.15s;
    }
    .email-item:hover { background: #1e1e3a; }
    .email-item.unread { border-left: 3px solid #7c3aed; }
    .email-item.read { border-left: 3px solid transparent; opacity: 0.7; }
    .email-item .sender { color: #a78bfa; font-size: 12px; font-weight: bold; }
    .email-item .subject { color: #fff; font-size: 11px; margin-top: 2px; }
    .email-item .preview { color: #666; font-size: 10px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .email-item .timestamp { color: #444; font-size: 10px; margin-top: 4px; }

    #email-detail {
      display: none;
      position: fixed;
      top: 0; right: 420px;
      width: 480px;
      height: 100vh;
      background: #0e0e22;
      border-left: 1px solid #3b3b5c;
      z-index: 200;
      flex-direction: column;
    }
    #email-detail.open { display: flex; }

    #detail-header {
      padding: 16px;
      border-bottom: 1px solid #3b3b5c;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #close-detail { background: none; border: none; color: #888; cursor: pointer; font-size: 18px; }

    #detail-content {
      padding: 20px;
      flex: 1;
      overflow-y: auto;
    }
    #detail-sender { color: #a78bfa; font-size: 13px; font-weight: bold; }
    #detail-subject { color: #fff; font-size: 15px; margin: 8px 0 4px; }
    #detail-day { color: #555; font-size: 11px; margin-bottom: 20px; }
    #detail-body { color: #ccc; font-size: 12px; line-height: 1.8; white-space: pre-wrap; }

    #reply-area {
      padding: 16px;
      border-top: 1px solid #3b3b5c;
    }
    #reply-area textarea {
      width: 100%;
      height: 90px;
      background: #1a1a3a;
      border: 1px solid #3b3b5c;
      color: #fff;
      font-family: monospace;
      font-size: 12px;
      padding: 8px;
      resize: none;
    }
    #reply-area textarea:focus { outline: none; border-color: #7c3aed; }
    #send-reply {
      margin-top: 8px;
      width: 100%;
      background: #7c3aed;
      color: #fff;
      border: none;
      padding: 8px;
      cursor: pointer;
      font-family: monospace;
      font-size: 12px;
    }
    #send-reply:hover { background: #6d28d9; }
    #send-reply:disabled { background: #3b3b5c; cursor: not-allowed; }
    #reply-status { color: #4ade80; font-size: 11px; margin-top: 6px; display: none; }
  </style>
</head>
<body>
<script src="/frontend/node_modules/phaser/dist/phaser.min.js"></script>

<button id="inbox-btn">📬 Inbox <span id="unread-count">0</span></button>

<div id="inbox-panel">
  <div id="inbox-header">
    <h2>📬 Inbox</h2>
    <button id="close-inbox">✕</button>
  </div>
  <div id="email-list"></div>
</div>

<div id="email-detail">
  <div id="detail-header">
    <span id="detail-sender"></span>
    <button id="close-detail">✕</button>
  </div>
  <div id="detail-content">
    <div id="detail-subject"></div>
    <div id="detail-day"></div>
    <div id="detail-body"></div>
  </div>
  <div id="reply-area">
    <textarea id="reply-text" placeholder="Write your reply..."></textarea>
    <button id="send-reply">Send Reply</button>
    <div id="reply-status">✓ Reply sent — your employee will react shortly.</div>
  </div>
</div>

<script>
// ---- INBOX LOGIC ----

let emails = [];
let currentEmailId = null;

function loadEmails() {
  fetch("/simulator/inbox.json")
    .then(r => r.json())
    .then(data => {
      const prev = emails.length;
      emails = data;
      renderEmailList();
      updateUnreadBadge();
    })
    .catch(() => {});
}

function updateUnreadBadge() {
  const unread = emails.filter(e => !e.read).length;
  const badge = document.getElementById("unread-count");
  const btn = document.getElementById("inbox-btn");
  if (unread > 0) {
    badge.textContent = unread;
    badge.style.display = "inline-block";
    btn.classList.add("has-unread");
  } else {
    badge.style.display = "none";
    btn.classList.remove("has-unread");
  }
}

function renderEmailList() {
  const list = document.getElementById("email-list");
  list.innerHTML = "";
  [...emails].reverse().forEach(email => {
    const div = document.createElement("div");
    div.className = `email-item ${email.read ? "read" : "unread"}`;
    div.innerHTML = `
      <div class="sender">${email.from}</div>
      <div class="subject">${email.subject}</div>
      <div class="preview">${email.body.substring(0, 60)}...</div>
      <div class="timestamp">Day ${email.day}</div>
    `;
    div.onclick = () => openEmail(email.id);
    list.appendChild(div);
  });
}

function openEmail(id) {
  const email = emails.find(e => e.id === id);
  if (!email) return;
  currentEmailId = id;

  document.getElementById("detail-sender").textContent = email.from;
  document.getElementById("detail-subject").textContent = email.subject;
  document.getElementById("detail-day").textContent = `Day ${email.day}`;
  document.getElementById("detail-body").textContent = email.body;
  document.getElementById("reply-text").value = "";
  document.getElementById("reply-status").style.display = "none";
  document.getElementById("send-reply").disabled = false;
  document.getElementById("email-detail").classList.add("open");

  // Mark as read
  email.read = true;
  saveInbox();
  renderEmailList();
  updateUnreadBadge();
}

function saveInbox() {
  fetch("http://localhost:3001/api/inbox", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(emails)
  }).catch(() => {});
}

function sendReply() {
  const text = document.getElementById("reply-text").value.trim();
  if (!text || !currentEmailId) return;

  const email = emails.find(e => e.id === currentEmailId);
  const btn = document.getElementById("send-reply");
  btn.disabled = true;

  fetch("http://localhost:3001/api/reply", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      email_id: currentEmailId,
      employee_id: email.employee_id,
      reply: text
    })
  })
  .then(r => r.json())
  .then(() => {
    document.getElementById("reply-status").style.display = "block";
    document.getElementById("reply-text").value = "";
  })
  .catch(() => {
    btn.disabled = false;
  });
}

// UI events
document.getElementById("inbox-btn").onclick = () => {
  document.getElementById("inbox-panel").classList.toggle("open");
};
document.getElementById("close-inbox").onclick = () => {
  document.getElementById("inbox-panel").classList.remove("open");
  document.getElementById("email-detail").classList.remove("open");
};
document.getElementById("close-detail").onclick = () => {
  document.getElementById("email-detail").classList.remove("open");
};
document.getElementById("send-reply").onclick = sendReply;

// Poll inbox every 5 seconds
setInterval(loadEmails, 5000);
loadEmails();
</script>

<script>
// ---- PHASER GAME ----
class OfficeScene extends Phaser.Scene {
  constructor() {
    super({ key: "OfficeScene" });
    this.employeeSprites = {};
    this.nameTexts = {};
    this.activityTexts = {};
    this.dayText = null;
    this.idleTimers = {};
  }

  preload() {
    this.load.spritesheet("maria", "/assets/character-female1.png", {
      frameWidth: 16, frameHeight: 32
    });
    this.load.spritesheet("james", "/assets/character-male1.png", {
      frameWidth: 16, frameHeight: 32
    });
  }

  create() {
    this.add.rectangle(400, 300, 800, 600, 0x2d2d44);
    this.add.rectangle(200, 270, 80, 20, 0x6b5a3e);
    this.add.rectangle(400, 270, 80, 20, 0x6b5a3e);
    this.add.rectangle(620, 180, 150, 100, 0x3a3a5c);
    this.add.text(548, 135, "Meeting Room", { fontSize: "10px", fill: "#888" });
    this.add.rectangle(650, 420, 120, 80, 0x3a3a5c);
    this.add.text(608, 383, "Break Area", { fontSize: "10px", fill: "#888" });

    this.dayText = this.add.text(16, 16, "Day 1", {
      fontSize: "16px", fill: "#ffffff", fontFamily: "monospace"
    });
    this.add.text(16, 40, "YOUR AGENCY", {
      fontSize: "11px", fill: "#888888", fontFamily: "monospace"
    });

    ["maria", "james"].forEach(key => {
      const blinkRate = Phaser.Math.Between(3, 6);
      this.anims.create({ key: `${key}_blink`, frames: [{ key, frame: 0 }, { key, frame: 0 }, { key, frame: 0 }, { key, frame: 0 }, { key, frame: 0 }, { key, frame: 0 }, { key, frame: 0 }, { key, frame: 0 }, { key, frame: 3 }], frameRate: blinkRate, repeat: -1 });
      this.anims.create({ key: `${key}_idle_front`, frames: [{ key, frame: 0 }], frameRate: 1, repeat: -1 });
      this.anims.create({ key: `${key}_walk_front`, frames: this.anims.generateFrameNumbers(key, { start: 1, end: 2 }), frameRate: 6, repeat: -1 });
      this.anims.create({ key: `${key}_idle_side`, frames: [{ key, frame: 4 }], frameRate: 1, repeat: -1 });
      this.anims.create({ key: `${key}_walk_side`, frames: this.anims.generateFrameNumbers(key, { start: 5, end: 6 }), frameRate: 6, repeat: -1 });
      this.anims.create({ key: `${key}_idle_back`, frames: [{ key, frame: 8 }], frameRate: 1, repeat: -1 });
      this.anims.create({ key: `${key}_walk_back`, frames: this.anims.generateFrameNumbers(key, { start: 9, end: 10 }), frameRate: 6, repeat: -1 });
    });

    this.createEmployee("emp_001", "Maria", 200, 250, "maria");
    this.createEmployee("emp_002", "James", 400, 250, "james");

    this.time.addEvent({ delay: 3000, callback: this.pollState, callbackScope: this, loop: true });
  }

  createEmployee(id, name, x, y, textureKey) {
    const sprite = this.add.sprite(x, y, textureKey, 0);
    sprite.setScale(3);
    sprite.textureKey = textureKey;
    sprite.currentDirection = "front";
    sprite.play(`${textureKey}_blink`);

    const nameTag = this.add.text(x - 16, y + 26, name, {
      fontSize: "10px", fill: "#ffffff", fontFamily: "monospace"
    });
    const activityTag = this.add.text(x - 24, y + 38, "working", {
      fontSize: "9px", fill: "#aaaaaa", fontFamily: "monospace"
    });

    this.employeeSprites[id] = sprite;
    this.nameTexts[id] = nameTag;
    this.activityTexts[id] = activityTag;
  }

  moveEmployeeTo(id, activity) {
    const positions = {
      "working":                  { "emp_001": {x:200,y:250}, "emp_002": {x:400,y:250} },
      "focused":                  { "emp_001": {x:200,y:250}, "emp_002": {x:400,y:250} },
      "distracted":               { "emp_001": {x:230,y:290}, "emp_002": {x:430,y:290} },
      "in a meeting":             { "emp_001": {x:600,y:180}, "emp_002": {x:640,y:180} },
      "on a break":               { "emp_001": {x:630,y:420}, "emp_002": {x:670,y:420} },
      "chatting with a coworker": { "emp_001": {x:300,y:310}, "emp_002": {x:340,y:310} }
    };

    const pos = positions[activity]?.[id];
    const sprite = this.employeeSprites[id];
    const nameTag = this.nameTexts[id];
    const actTag = this.activityTexts[id];
    const key = sprite.textureKey;

    if (pos && sprite) {
      const dx = pos.x - sprite.x;
      const dy = pos.y - sprite.y;
      const moving = Math.abs(dx) > 5 || Math.abs(dy) > 5;

      if (moving) {
        if (Math.abs(dx) > Math.abs(dy)) {
          sprite.play(`${key}_walk_side`, true);
          sprite.setFlipX(dx < 0);
        } else {
          sprite.play(dy > 0 ? `${key}_walk_front` : `${key}_walk_back`, true);
          sprite.setFlipX(false);
        }
      }

      this.tweens.add({
        targets: sprite,
        x: pos.x, y: pos.y,
        duration: 800, ease: "Power2",
        onComplete: () => {
          sprite.setFlipX(false);
          sprite.play(`${key}_blink`, true);
          sprite.currentDirection = "front";
        }
      });

      this.tweens.add({ targets: nameTag, x: pos.x - 16, y: pos.y + 26, duration: 800, ease: "Power2" });
      this.tweens.add({ targets: actTag, x: pos.x - 24, y: pos.y + 38, duration: 800, ease: "Power2" });
    }
  }

  pollState() {
    fetch("/simulator/state.json")
      .then(r => r.json())
      .then(state => {
        this.dayText.setText(`Day ${state.agency.day}`);
        state.employees.forEach(emp => {
          const sprite = this.employeeSprites[emp.id];
          const actText = this.activityTexts[emp.id];
          if (sprite) {
            actText.setText(emp.current_activity);
            this.moveEmployeeTo(emp.id, emp.current_activity);
          }
        });
      })
      .catch(err => console.log("State not loaded:", err));
  }
}

const config = {
  type: Phaser.AUTO,
  width: 800,
  height: 600,
  backgroundColor: "#1a1a2e",
  pixelArt: true,
  scene: OfficeScene
};

const game = new Phaser.Game(config);
</script>
</body>
</html>
